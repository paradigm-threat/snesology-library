image: alpine:latest

pages:
  stage: deploy
  script:
    - mkdir -p public
    - |
      for dir in */; do
        case "$dir" in
          public/|.git/) continue ;;
        esac
        cp -r "$dir" public/
      done
    - cp -f index.json public/ 2>/dev/null || true
    - cp -f README.md public/ 2>/dev/null || true
  artifacts:
    paths:
      - public
  rules:
    - if: $CI_COMMIT_REF_NAME == $CI_DEFAULT_BRANCH
